<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Mold — Physarum polycephalum</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 8px;
            font-family: monospace;
        }
        #wrap {
            position: relative;
            width: 800px;
            height: 800px;
            cursor: crosshair;
        }
        #bg, #ui-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 800px; height: 800px;
        }
        #ui-canvas { pointer-events: none; }

        /* Overlay panels inside #wrap */
        .panel {
            position: absolute;
            background: rgba(0,10,0,0.75);
            border: 1px solid #1a3a1a;
            padding: 8px 10px;
            font-size: 11px;
            color: #00aa22;
            pointer-events: none;
            line-height: 1.6;
        }
        #legend { bottom: 8px; left: 8px; }
        #stats-overlay { bottom: 8px; right: 8px; text-align: right; }
        .legend-row { display: flex; align-items: center; gap: 6px; }
        .swatch {
            display: inline-block;
            width: 12px; height: 4px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .dot-swatch {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .ring-swatch {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.5);
            flex-shrink: 0;
        }
        .signal-dot {
            display: inline-block;
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(200,255,100,0.8);
            flex-shrink: 0;
        }

        /* Controls row */
        #controls {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 800px;
        }
        #status { color: #00cc33; font-size: 13px; min-width: 70px; }
        button {
            background: transparent;
            color: #00cc33;
            border: 1px solid #00cc33;
            padding: 3px 12px;
            font-family: monospace;
            font-size: 12px;
            cursor: pointer;
        }
        button:hover { background: #001800; }
        #speed-label { color: #00aa22; font-size: 12px; white-space: nowrap; }
        #speed { accent-color: #00cc33; cursor: pointer; width: 100px; }
    </style>
</head>
<body>
<div id="wrap">
    <canvas id="bg"></canvas>
    <canvas id="ui-canvas"></canvas>

    <div class="panel" id="legend">
        <div class="legend-row"><span class="swatch" style="background:rgba(220,255,180,1)"></span> Major vein (D &gt; 2.0)</div>
        <div class="legend-row"><span class="swatch" style="background:rgba(80,230,80,0.9)"></span> Active tube (D &gt; 0.5)</div>
        <div class="legend-row"><span class="swatch" style="background:rgba(10,100,10,0.55)"></span> Faint network</div>
        <div class="legend-row"><span class="dot-swatch" style="background:rgba(100,180,255,0.9)"></span> Sink origin</div>
        <div class="legend-row"><span class="dot-swatch" style="background:rgba(100,255,100,0.9)"></span> Food source</div>
        <div class="legend-row"><span class="dot-swatch" style="background:rgba(60,120,60,0.6)"></span> Food (consumed)</div>
        <div class="legend-row"><span class="ring-swatch"></span> Past food scar</div>
        <div class="legend-row"><span class="signal-dot"></span> Signal concentration</div>
    </div>

    <div class="panel" id="stats-overlay">
        <div id="st-tubes">Active tubes: —</div>
        <div id="st-veins">Major veins: —</div>
        <div id="st-cover">Coverage: —</div>
        <div id="st-signal">Signal nodes: —</div>
        <div id="st-food">Food: —</div>
        <div id="st-tick">Tick: —</div>
        <div id="st-fps">FPS: —</div>
    </div>
</div>

<div id="controls">
    <span id="status">loading…</span>
    <button id="btn-reset">Reset</button>
    <button id="btn-preset">Preset A↔B</button>
    <label id="speed-label">Speed: <span id="speed-val">3</span>x
        <input type="range" id="speed" min="1" max="10" value="3">
    </label>
    <span style="color:#336633;font-size:11px">click canvas to add food</span>
</div>

<script>
// --- Grid / canvas constants (doc 07, 09) ---
const GRID_W = 200, GRID_H = 200;
const CANVAS_W = 800, CANVAS_H = 800;
const SCALE = CANVAS_W / GRID_W;           // 4px per grid unit
const HORIZ_COUNT = (GRID_W - 1) * GRID_H; // 39,800
const VERT_COUNT  = GRID_W * (GRID_H - 1); // 39,800
const TOTAL_EDGES = HORIZ_COUNT + VERT_COUNT;
const NODE_COUNT  = GRID_W * GRID_H;

async function main() {
    const statusEl  = document.getElementById('status');
    const speedSlider = document.getElementById('speed');
    const speedVal    = document.getElementById('speed-val');
    speedSlider.addEventListener('input', () => { speedVal.textContent = speedSlider.value; });

    const resp  = await fetch('slime.wasm');
    const bytes = await resp.arrayBuffer();
    const { instance } = await WebAssembly.instantiate(bytes);
    const wasm = instance.exports;

    const bgCanvas  = document.getElementById('bg');
    const uiCanvas  = document.getElementById('ui-canvas');
    bgCanvas.width  = uiCanvas.width  = CANVAS_W;
    bgCanvas.height = uiCanvas.height = CANVAS_H;
    const bgCtx  = bgCanvas.getContext('2d');
    const uiCtx  = uiCanvas.getContext('2d');

    // --- WASM memory views (refresh after each init()) ---
    let conductance, phase, signal, food;
    function refreshViews() {
        const buf = wasm.memory.buffer;
        conductance = new Float32Array(buf, wasm.getConductancePtr(), TOTAL_EDGES);
        phase       = new Float32Array(buf, wasm.getPhasePtr(),       TOTAL_EDGES);
        signal      = new Float32Array(buf, wasm.getSignalPtr(),      NODE_COUNT);
        food        = new Float32Array(buf, wasm.getFoodPtr(),        NODE_COUNT);
    }

    // --- Food / scar tracking ---
    // Each: { gx, gy, nodeIdx, px, py, role, consumed, food_placed }
    const foodNodes = [];
    const scars     = [];   // { px, py, addedAt }
    let totalFoodPlaced = 0;

    function placeFood(gx, gy) {
        const nodeIdx = gy * GRID_W + gx;
        const px = gx * SCALE + SCALE / 2;
        const py = gy * SCALE + SCALE / 2;
        const role = foodNodes.length === 1 ? 'sink' : 'source';
        if (foodNodes.length === 1) foodNodes[0].role = 'sink';
        foodNodes.push({ gx, gy, nodeIdx, px, py, role, consumed: false, food_placed: 255 });
        wasm.setFood(gx, gy, 255.0);
        totalFoodPlaced++;
    }

    function applyPreset() {
        // Test 1.1 (doc 12): two food sources at ends, sink at center.
        // A index = 100*200+20  = 20020
        // B index = 100*200+180 = 20180
        // Sink    = 100*200+100 = 20100
        wasm.clearFood();

        // Source A: (20, 100)
        wasm.addSource(20, 100, 255.0);
        foodNodes.push({ gx: 20, gy: 100, nodeIdx: 100 * GRID_W + 20,
            px: 20 * SCALE + SCALE / 2, py: 100 * SCALE + SCALE / 2,
            role: 'source', consumed: false });

        // Source B: (180, 100)
        wasm.addSource(180, 100, 255.0);
        foodNodes.push({ gx: 180, gy: 100, nodeIdx: 100 * GRID_W + 180,
            px: 180 * SCALE + SCALE / 2, py: 100 * SCALE + SCALE / 2,
            role: 'source', consumed: false });

        // Sink: (100, 100)
        wasm.addSink(100, 100);
        foodNodes.push({ gx: 100, gy: 100, nodeIdx: 100 * GRID_W + 100,
            px: 100 * SCALE + SCALE / 2, py: 100 * SCALE + SCALE / 2,
            role: 'sink', consumed: false });

        totalFoodPlaced += 2;
    }

    wasm.init(GRID_W, GRID_H);
    refreshViews();
    applyPreset();

    document.getElementById('wrap').addEventListener('click', (e) => {
        const rect = bgCanvas.getBoundingClientRect();
        const cx = (e.clientX - rect.left) * CANVAS_W / rect.width;
        const cy = (e.clientY - rect.top)  * CANVAS_H / rect.height;
        const gx = Math.max(0, Math.min(GRID_W - 1, Math.floor(cx / SCALE)));
        const gy = Math.max(0, Math.min(GRID_H - 1, Math.floor(cy / SCALE)));
        placeFood(gx, gy);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
        wasm.reset();
        refreshViews();
        foodNodes.length = 0;
        scars.length     = 0;
        totalFoodPlaced  = 0;
        tickCount        = 0;
        applyPreset();
    });

    document.getElementById('btn-preset').addEventListener('click', () => {
        wasm.reset();
        refreshViews();
        foodNodes.length = 0;
        scars.length     = 0;
        totalFoodPlaced  = 0;
        tickCount        = 0;
        applyPreset();
    });

    // --- Rendering ---

    function drawEdges() {
        bgCtx.fillStyle = '#000800';
        bgCtx.fillRect(0, 0, CANVAS_W, CANVAS_H);

        const scale = bgCanvas.width / 200;
        for (let e = 0; e < TOTAL_EDGES; e++) {
            const D = conductance[e];
            if (D < 0.005) continue;

            let ni, nj;
            if (e < HORIZ_COUNT) {
                const row = Math.floor(e / 199);
                const col = e % 199;
                ni = row * 200 + col;
                nj = ni + 1;
            } else {
                const idx = e - HORIZ_COUNT;
                const row = Math.floor(idx / 200);
                const col = idx % 200;
                ni = row * 200 + col;
                nj = ni + 200;
            }

            const x1 = (ni % 200 + 0.5) * scale;
            const y1 = (Math.floor(ni / 200) + 0.5) * scale;
            const x2 = (nj % 200 + 0.5) * scale;
            const y2 = (Math.floor(nj / 200) + 0.5) * scale;

            const wave = Math.sin(phase[e]);
            const modulation = wave * 40 * Math.min(1, D * 2);
            const brightness = Math.min(255, Math.max(0, 60 + D * 120 + modulation));
            bgCtx.beginPath();
            bgCtx.moveTo(x1, y1);
            bgCtx.lineTo(x2, y2);
            bgCtx.lineWidth = Math.min(3, Math.max(0.5, D * 2));
            bgCtx.strokeStyle = `rgba(0, ${brightness}, 0, ${Math.min(1, D * 2)})`;
            bgCtx.stroke();
        }
    }

    function drawNodes() {
        uiCtx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        const pulse = 0.7 + 0.3 * Math.sin(Date.now() / 400);
        const now   = Date.now();

        // Food source / sink glows
        for (const node of foodNodes) {
            const strength = node.consumed ? 0 : food[node.nodeIdx] / 255.0;
            const r = node.role === 'source' ? 10 + strength * 16 : 6;

            let inner, mid, outer;
            if (node.role === 'sink') {
                inner = `rgba(160,210,255,${(0.8 * pulse).toFixed(2)})`;
                mid   = `rgba(80,140,255,${(0.5 * pulse).toFixed(2)})`;
                outer = 'rgba(0,40,200,0)';
            } else if (node.consumed) {
                inner = 'rgba(40,80,40,0.5)';
                mid   = 'rgba(20,60,20,0.3)';
                outer = 'rgba(0,0,0,0)';
            } else {
                const a = 0.5 + 0.5 * strength;
                inner = `rgba(255,255,200,${(a * pulse).toFixed(2)})`;
                mid   = `rgba(100,255,100,${(a * 0.8 * pulse).toFixed(2)})`;
                outer = 'rgba(0,100,0,0)';
            }

            const grad = uiCtx.createRadialGradient(node.px, node.py, 0, node.px, node.py, r * 2.5);
            grad.addColorStop(0, inner);
            grad.addColorStop(0.4, mid);
            grad.addColorStop(1, outer);
            uiCtx.fillStyle = grad;
            uiCtx.beginPath();
            uiCtx.arc(node.px, node.py, r * 2.5, 0, Math.PI * 2);
            uiCtx.fill();
        }

        // Signal concentration dots on high-signal nodes
        for (let nodeIdx = 0; nodeIdx < NODE_COUNT; nodeIdx++) {
            const s = signal[nodeIdx];
            if (s < 20) continue;
            const gy = Math.floor(nodeIdx / GRID_W);
            const gx = nodeIdx % GRID_W;
            const px = gx * SCALE;
            const py = gy * SCALE;
            const alpha = (s / 255.0) * 0.6;
            uiCtx.fillStyle = `rgba(200,255,100,${alpha.toFixed(2)})`;
            uiCtx.beginPath();
            uiCtx.arc(px, py, 2, 0, Math.PI * 2);
            uiCtx.fill();
        }

        // Food scars (white fading rings — past food locations)
        for (let i = scars.length - 1; i >= 0; i--) {
            const age = (now - scars[i].addedAt) / 5000; // 0→1 over 5s
            if (age >= 1.0) { scars.splice(i, 1); continue; }
            const alpha = (1.0 - age) * 0.6;
            uiCtx.strokeStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
            uiCtx.lineWidth   = 1.5;
            uiCtx.beginPath();
            uiCtx.arc(scars[i].px, scars[i].py, 10 + age * 5, 0, Math.PI * 2);
            uiCtx.stroke();
        }
    }

    // --- Stats update (every second) ---
    let frames    = 0;
    let tickCount = 0;
    let lastStats = performance.now();
    let totalFood = 255 * 2; // updated on reset

    function updateStats() {
        const activeEdges = wasm.getActiveEdgeCount();
        const majorVeins  = wasm.getMajorVeinCount();
        const signalNodes = wasm.getSignalNodeCount();
        const foodLeft    = wasm.getFoodRemaining();

        const coverage = ((activeEdges / TOTAL_EDGES) * 100).toFixed(1);
        const foodPct  = totalFoodPlaced > 0
            ? (foodLeft / (255 * totalFoodPlaced) * 100).toFixed(0)
            : '—';

        document.getElementById('st-tubes').textContent  = `Active tubes: ${activeEdges.toLocaleString()} / ${TOTAL_EDGES.toLocaleString()}`;
        document.getElementById('st-veins').textContent  = `Major veins: ${majorVeins.toLocaleString()}`;
        document.getElementById('st-cover').textContent  = `Coverage: ${coverage}%`;
        document.getElementById('st-signal').textContent = `Signal nodes: ${signalNodes.toLocaleString()}`;
        document.getElementById('st-food').textContent   = `Food: ${foodPct}%`;
        document.getElementById('st-tick').textContent   = `Tick: ${tickCount.toLocaleString()}`;
        document.getElementById('st-fps').textContent    = `FPS: ${frames}`;
        frames = 0;
    }

    // --- Main loop ---
    function frame() {
        const steps = parseInt(speedSlider.value, 10);
        for (let i = 0; i < steps; i++) {
            wasm.step();
            tickCount++;
        }

        // Check for newly consumed food (food[nodeIdx] → 0)
        for (const node of foodNodes) {
            if (!node.consumed && food[node.nodeIdx] < 1.0) {
                node.consumed = true;
                scars.push({ px: node.px, py: node.py, addedAt: Date.now() });
            }
        }

        drawEdges();
        drawNodes();

        frames++;
        const now = performance.now();
        if (now - lastStats >= 1000) {
            updateStats();
            lastStats = now;
        }

        requestAnimationFrame(frame);
    }

    statusEl.textContent = 'running';
    requestAnimationFrame(frame);
}

main().catch(err => {
    document.getElementById('status').textContent = 'error: ' + err.message;
    console.error(err);
});
</script>
</body>
</html>
